name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.6"
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v4

      # --- GitHub-only steps ---
      - name: Set up Docker Compose
        if: ${{ runner.environment == 'github-hosted' }}
        uses: docker/setup-compose-action@v2
        with:
          version: latest

      - name: Run tests in Docker
        run: PYTHON_VERSION=${{ matrix.python }} docker compose run --rm --build python-clamd-test
